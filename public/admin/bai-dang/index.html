<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Bài đăng | Serene Travel</title><link rel="icon" href="/favicon.ico" sizes="48x48"><link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png"><link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png"><meta name="apple-mobile-web-app-title" content="Serene Quản trị"><meta name="theme-color" content="#2D6E7E"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Playfair+Display:wght@500;600&display=swap"><link rel="stylesheet" href="../admin.css"><link rel="stylesheet" href="./bai-dang.css"></head><body>
<header><a href="/admin/" class="brand"><img src="/assets/8436733ede1296a71ad7.jpg" alt=""><span>Serene Travel</span></a><span class="header-note">Quản lý bài đăng</span><a class="nav-link first" href="/admin/">Chọn khu</a><a class="nav-link" href="/admin/booking/">Booking</a><button id="logout" type="button">Đăng xuất</button></header>
<main>
<nav class="seg" id="seg" aria-label="Chọn khu"><button type="button" data-sec="posts" class="on">Bài đăng</button><button type="button" data-sec="msgs">Tin nhắn mẫu</button><button type="button" data-sec="photos">Thư viện ảnh</button></nav>
<section id="sec-posts">
<div class="posts-top"><h1>Bài đăng</h1><div class="posts-add"><button id="add-facebook" class="primary" type="button">+ Bài Facebook</button><button id="add-threads" type="button">+ Bài Threads</button></div></div>
<p id="status" role="status" aria-live="polite"></p>
<div class="tabs" id="tabs" role="tablist" aria-label="Lọc bài"></div>
<div id="list" class="post-list"></div>
</section>
<section id="sec-msgs" hidden></section>
<section id="sec-photos" hidden></section>
<div id="qtoast" class="qtoast" role="status" aria-live="polite"></div>
</main>
<dialog id="schedule-dialog"><form method="dialog" class="schedule"><h2 id="schedule-title">Hẹn giờ đăng</h2><label for="schedule-date">Ngày đăng<input id="schedule-date" type="date"></label><div class="chips-label">Bấm vào giờ để hẹn</div><div id="chips" class="chips"></div><label for="schedule-custom">Hoặc nhập giờ khác<input id="schedule-custom" type="time"></label><div class="schedule-actions"><button id="schedule-custom-ok" type="button" class="primary">Hẹn giờ này</button><button id="schedule-cancel" type="button">Đóng</button></div><p id="schedule-note">Giờ đăng phải cách hiện tại ít nhất 5 phút.</p></form></dialog>
<dialog id="report-dialog"><form method="dialog" class="schedule"><h2>Báo cáo sửa bài</h2><p class="hint">Bấm "Sao chép báo cáo", rồi dán vào cuộc trò chuyện với Claude để Claude học cách hành văn của bạn.</p><textarea id="report-text" rows="14" readonly></textarea><div class="schedule-actions"><button id="report-copy" type="button" class="primary">Sao chép báo cáo</button><button id="report-close" type="button">Đóng</button></div></form></dialog>
<script type="module" src="./bai-dang.js"></script><script type="module" src="./quick.js"></script>
</body></html>
